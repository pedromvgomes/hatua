# .bulwark.yml — this file is yours.
#
# gt created it once and will never modify or delete it again. bulwark owns
# what goes in it; gt only makes sure it exists, because the one setting below
# decides whether the pipeline runs your test suite once or twice.
#
# `coverage.source` says who produces the coverage bulwark gates on:
#
#   run     bulwark executes the suite itself. Slower, and correct whenever
#           nothing else has produced a report yet.
#   report  bulwark only reads a report someone else produced. Faster, and
#           WRONG until something actually produces one — bulwark exits with
#           an error when told to read a report that is not there.
#
# It starts as `run` because that is what is true the moment this file is
# created: ci-test is a scaffolded no-op, so nothing uploads coverage yet.
#
# Change it to `report` in the same commit that makes ci-test produce coverage
# and upload it as the `gt-coverage` artifact, which the bulwark stage extracts
# before bulwark runs. Flipping it earlier trades a double test run for a
# failing security gate.
#
# Everything else bulwark supports — per-language enablement, coverage
# tolerances, patch-coverage opt-outs, toolchain overrides — belongs here too.
# See bulwark's README.
# bulwark's TypeScript gate, on, running Biome.
#
# It was off because bulwark's only TypeScript checker was ESLint, and ESLint 9+
# hard-errors when a package has no eslint.config.js rather than falling back to
# defaults — which is every package here, since biome is this repo's linter.
# bulwark v1.9.0 added `linter: biome`, so the reason is gone.
#
# `linter` defaults to eslint, so naming it is what actually switches this over.
# The two are NOT the same rule set and swapping them changes what is enforced in
# both directions: eslint-plugin-security is Node/backend heuristics, while
# bulwark's Biome profile gates on Biome's `security` and `correctness` groups.
#
# That profile is bulwark's own, passed with --config-path, and it overrides this
# repo's biome.json rather than merging with it. Two consequences worth knowing
# before touching either file:
#
#   * `correctness` is enabled as a whole group, not the recommended subset, so
#     it is stricter than `pnpm biome check`. source/biome.json now sets
#     `security` and `correctness` to error for exactly this reason — the local
#     lint and this gate should agree, or every suppression written for one is
#     dead code to the other.
#
#   * There is no per-project ignore surface. `typescript.exclude` only skips
#     package DISCOVERY, and everything here lives under source/, which is itself
#     a detected package — so an excluded subdirectory still gets linted as part
#     of its parent. The only lever is a `biome-ignore` in the source, which is
#     why the Node-side tooling and tests carry file-level suppressions, and why
#     tools/expression/src/build.js writes two into the generated parser.
#
# source/biome.json also carries no `$schema` any more. bulwark reports every
# diagnostic Biome emits regardless of severity, and a `$schema` naming a version
# other than bulwark's pinned CLI is an *informational* deserialize notice — so
# the two pins drifting by a patch release turned the gate red on its own. Worth
# fixing upstream; until then, not declaring the schema is what decouples us.
typescript:
  enabled: true
  linter: biome

# `report`: ci-test already runs every suite with instrumentation and uploads the
# result as the `gt-coverage` artifact, so bulwark reads those reports rather
# than running all of it a second time.
#
# What makes this work for a repo with nine TypeScript packages is the LAYOUT of
# that artifact. bulwark looks for each report next to the unit that produced it
# — <moduleDir>/coverage.out per Go module, and
# <packageDir>/coverage/{coverage-summary.json,lcov.info} per TypeScript package,
# the latter with no path override at all because those locations are Vitest
# convention rather than a project's choice. So ci-test stages the artifact as a
# mirror of this repository and the bulwark stage restores it into the scan root,
# where discovery already looks.
#
# That mirroring is gt's reusable-bulwark stage as of pedromvgomes/gt#44. Against
# an older gt it copies two named files from the artifact root instead, finds
# neither, and every language reports as unmeasured — a warning, not a failure,
# so the pipeline stays green while the coverage gate quietly covers nothing.
# If coverage ever reads [UNMEASURED] for a language that has reports, check the
# bulwark stage's "Place the coverage report where bulwark looks" step first.
coverage:
  source: report
