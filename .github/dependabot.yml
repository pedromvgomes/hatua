# Managed by gt — edit .gt-repo.yaml, then run `gt repo sync`.
#
# Shared policy (cooldown, commit-message prefix, schedule) lives in gt's
# template, not here, so changing it for every repo is a one-line edit in gt.
#
# The 7-day cooldown is the supply-chain guard: by the time a PR exists,
# the upstream release has been in the wild long enough to surface yanks and
# compromised publishers before an auto-merge-eligible PR lands on the default
# branch.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Dependabot's commit message is also its PR title, and PRs are
    # squash-merged, so the prefix is what keeps dependency updates inside
    # Conventional Commits. `include: scope` appends the dependency scope,
    # producing e.g. `ci(deps): bump …`.
    commit-message:
      prefix: "ci"
      include: scope
    cooldown:
      default-days: 7
    open-pull-requests-limit: 25

  # The pnpm workspace ROOT, not each member. There is a single lockfile at
  # source/pnpm-lock.yaml, so pointing Dependabot at packages/* or apps/*
  # would make every PR fail `pnpm install --frozen-lockfile`.
  - package-ecosystem: "npm"
    directory: "/source"
    schedule:
      interval: "weekly"
    # Dependabot's commit message is also its PR title, and PRs are
    # squash-merged, so the prefix is what keeps dependency updates inside
    # Conventional Commits. `include: scope` appends the dependency scope,
    # producing e.g. `build(deps): bump …`.
    commit-message:
      prefix: "build"
      include: scope
    cooldown:
      default-days: 7
    open-pull-requests-limit: 25

  # Its own project with its own lockfile, outside the source workspace.
  - package-ecosystem: "npm"
    directory: "/brand"
    schedule:
      interval: "weekly"
    # Dependabot's commit message is also its PR title, and PRs are
    # squash-merged, so the prefix is what keeps dependency updates inside
    # Conventional Commits. `include: scope` appends the dependency scope,
    # producing e.g. `build(deps): bump …`.
    commit-message:
      prefix: "build"
      include: scope
    cooldown:
      default-days: 7
    open-pull-requests-limit: 25

  # The Go SDK module. ci-test builds, vets and tests it on the Go version
  # setup-go reads out of this go.mod through go-version-file, so this entry
  # is what moves that version as well as the module's dependencies.
  - package-ecosystem: "gomod"
    directory: "/source/sdk/go"
    schedule:
      interval: "weekly"
    # Dependabot's commit message is also its PR title, and PRs are
    # squash-merged, so the prefix is what keeps dependency updates inside
    # Conventional Commits. `include: scope` appends the dependency scope,
    # producing e.g. `build(deps): bump …`.
    commit-message:
      prefix: "build"
      include: scope
    cooldown:
      default-days: 7
    open-pull-requests-limit: 25
