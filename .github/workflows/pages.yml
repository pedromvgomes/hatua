# pages — publishes the Storybook to GitHub Pages.
#
# The Storybook is the review surface for the primitives: every one of them in
# both colour modes, plus the token sheet the two modes are read against. That
# is only useful if it is a link, so it deploys on every push to main.
#
# It deploys from main and nowhere else. A branch cannot publish, so this file
# can be reviewed on a pull request but will not run until the PR lands — and a
# reviewer wanting to see the stories before then runs
# `pnpm --filter @hatua/react storybook` locally.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default. The Pages deploy credential and the OIDC token belong to
# the deploy job alone: build runs `pnpm install` with third-party postinstall
# scripts (esbuild, @swc/core) and then a Storybook build, and none of that
# should be able to reach a deployment.
permissions:
  contents: read

# One deployment at a time, and never cancel one in flight: a cancelled deploy
# leaves Pages serving whatever half-state it got to.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          # packageManager lives in source/, not at the repo root.
          package_json_file: source/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @hatua/react storybook:build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: source/packages/react/storybook-static

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
