# ci-test — this file is yours.
#
# gt created it once and will never modify or delete it again. Put this
# repository's test suite here; the orchestration around it stays gt's.
#
# Coverage is uploaded as an artifact named `gt-coverage`, which the bulwark
# stage consumes instead of running every suite a second time — `.bulwark.yml`
# declares `coverage.source: report` to match. The artifact mirrors this
# repository's own layout, because bulwark looks for each report next to the
# unit that produced it rather than at one agreed path.
name: ci-test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          # packageManager lives in source/, not at the repo root.
          package_json_file: source/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # test:coverage rather than test: it runs the same suites, and the
      # instrumentation is what lets the bulwark stage read a report instead of
      # running all of this again.
      - run: pnpm turbo run test:coverage

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: source/sdk/go/go.mod
          cache-dependency-path: source/sdk/go/go.sum

      # The Go SDK runs the SAME conformance fixtures as the TypeScript suite.
      # Generation guarantees the two share a shape; only this guarantees they
      # share behaviour.
      - name: Go SDK
        working-directory: source/sdk/go
        run: |
          # gofmt has no equivalent of `biome ci` in the JS gate, so check it
          # explicitly — otherwise Go formatting drifts unnoticed.
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would reformat these files:"
            echo "$unformatted"
            exit 1
          fi
          go vet ./...
          # Written inside the module it measures: `go test -coverprofile` is
          # module-scoped, and bulwark looks for <moduleDir>/coverage.out.
          go test -coverprofile=coverage.out ./...

      - name: Collect coverage into the artifact layout
        # Staged under one directory whose contents mirror the repository from
        # its root, rather than listing the report paths on the upload directly.
        # Multiple `path:` entries make upload-artifact root the archive at their
        # common ancestor — here `source/` — quietly stripping the prefix every
        # path needs in order to land correctly at the scan root.
        #
        # Nothing is renamed on the way in. bulwark finds a Go module's profile
        # at <moduleDir>/coverage.out and a TypeScript package's pair at
        # <packageDir>/coverage/{coverage-summary.json,lcov.info}, so a copy that
        # preserves the repo-relative path needs no configuration to match it.
        working-directory: .
        env:
          STAGE: ${{ runner.temp }}/gt-coverage
        run: |
          set -euo pipefail
          collected=0
          while IFS= read -r -d '' report; do
            mkdir -p "${STAGE}/$(dirname "$report")"
            cp "$report" "${STAGE}/${report}"
            echo "collected ${report}"
            collected=$((collected + 1))
          done < <(
            find source \
              \( -name node_modules -o -name dist -o -name .turbo \) -prune -o \
              -type f \( -name coverage.out \
                       -o -path '*/coverage/lcov.info' \
                       -o -path '*/coverage/coverage-summary.json' \) -print0
          )
          # An empty artifact is the failure this arrangement exists to avoid:
          # bulwark would find no report, mark every language unmeasured, warn,
          # and still pass — a coverage gate that stopped covering anything,
          # reported as green.
          if [[ "$collected" -eq 0 ]]; then
            echo "::error::no coverage reports found to upload"
            exit 1
          fi
          echo "collected ${collected} report(s)"

      - name: Upload coverage for the bulwark stage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gt-coverage
          path: ${{ runner.temp }}/gt-coverage
          retention-days: 1

      # One grammar feeds two generators, and the committed parsers are what
      # every consumer actually runs. This regenerates both, runs the shared
      # scenarios against the fresh output, and diffs against what is committed
      # — so a stale parser and a failing one are both caught, and neither can
      # be papered over by the check itself rewriting the tree.
      - name: Expression parsers are current and passing
        working-directory: source/tools/expression
        run: make check-drift

      # The single most important signal in the build: the SAME scenario files
      # passing in both languages. A scenario counted by one harness and skipped
      # by the other is exactly the divergence the corpus exists to catch, so the
      # two tallies are compared rather than merely both being green.
      - name: Expression scenarios agree across languages
        working-directory: source/tools/expression
        run: make test
