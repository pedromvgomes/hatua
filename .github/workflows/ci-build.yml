# ci-build — this file is yours.
#
# gt created it once and will never modify or delete it again. Put this
# repository's build steps here; the orchestration around it stays gt's.
#
# It is called by ci-orchestration.yml and must keep `workflow_call`, or the
# orchestrator loses the stage.
name: ci-build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # packageManager lives in source/, not at the repo root.
          package_json_file: source/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Formatting and the tier-boundary import rules (primitives may not reach
      # into services, and so on) — see biome.json overrides.
      - run: pnpm biome ci .

      # The zod in packages/schema is generated from schemas/*.schema.yaml.
      # Regenerate and fail on any diff, so a stale committed artefact — which
      # would silently disagree with the Go SDK — cannot merge.
      - name: Codegen is reproducible
        run: |
          pnpm codegen
          # `git status --porcelain`, not `git diff`: diff ignores untracked
          # files, so a newly generated file would pass this check vacuously.
          changed="$(git status --porcelain -- packages/schema/src/generated)"
          if [ -n "$changed" ]; then
            echo "::error::generated code is stale — run 'pnpm codegen' and commit"
            echo "$changed"
            git diff -- packages/schema/src/generated
            exit 1
          fi

      # The shared PEG grammar has to stay inside the subset both generators
      # accept. Nothing in either tool enforces that, and the failure would
      # otherwise surface as one language's build breaking long after the change
      # that caused it.
      - name: Grammar stays in the shared subset
        working-directory: source/tools/expression
        run: make lint

      - run: pnpm turbo run typecheck build

      # ADR-0003: a Host imports nothing. Every component renders its own CSS
      # through React 19's <style href precedence>, so the published bundle must
      # carry that CSS inside the JavaScript and must NOT carry a stylesheet
      # beside it — exporting one is deferred until there is a build step that
      # aggregates. Vite would emit one from the class-map imports; a plugin in
      # packages/react/vite.config.ts drops it, and this is what notices if that
      # plugin stops working.
      - name: The library ships no stylesheet
        run: |
          if find packages/react/dist -name '*.css' | grep -q .; then
            echo "::error::packages/react/dist contains a stylesheet; see ADR-0003"
            find packages/react/dist -name '*.css'
            exit 1
          fi
          if ! grep -q '@layer hatua' packages/react/dist/index.js; then
            echo "::error::the base layer is not inlined in dist/index.js; see ADR-0003"
            exit 1
          fi

      # The Storybook only deploys from main (.github/workflows/pages.yml), so
      # without this a pull request could break it and nothing would say so
      # until after the merge.
      - run: pnpm --filter @hatua/react storybook:build
