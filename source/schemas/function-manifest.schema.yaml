# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://hatua.dev/schemas/function-manifest.json
title: Function Manifest
description: >-
  The Host-supplied declaration of functions an Expression may call — `crm.owner_of(...)`,
  `pricing.tier(...)`. Hatua ships its own set under `dt`, `text`, `num`, `list` and `json`; the
  format is identical and the only difference is who wrote the file.

  Hatua never implements a Host function. It reads the signature so the builder can offer it, check
  its arity and argument types, and know what it returns; the Host's runner supplies the code. A
  declaration with no implementation behind it fails when the registry is built, not at a call site
  in production.

  This is a separate file rather than a third `kind:` inside the Component Manifest. A conditional
  manifest shape — `if kind is function then ...` — would need the JSON-Schema-to-zod generator to
  grow `if`/`then` support, and ADR-0006 keeps that generator deliberately narrow precisely because
  a silent mistranslation there is the failure the whole decision prevents.

  A namespace and name Hatua already declares is a loud error at merge time. Either silent winner —
  Hatua's or the Host's — is a workflow that behaves differently depending on which registry was
  built first, and neither is discoverable from the workflow.

oneOf:
  - $ref: "#/$defs/functionNamespace"
  - type: object
    additionalProperties: false
    required: [namespaces]
    properties:
      namespaces:
        type: array
        items: { $ref: "#/$defs/functionNamespace" }

$defs:
  functionNamespace:
    type: object
    additionalProperties: false
    required: [kind, namespace, functions]
    properties:
      kind:
        enum: [function]
      namespace:
        type: string
        pattern: "^[a-z][a-z0-9_]*$"
        description: >-
          The part before the dot. Namespaces need no reserved words because the `(` is what
          distinguishes a call from a path, so a step may still be called `crm`.
      summary:
        type: string
        description: One sentence, shown as the group heading in the function picker.
      functions:
        type: array
        minItems: 1
        items: { $ref: "#/$defs/functionSpec" }

  functionSpec:
    type: object
    additionalProperties: false
    required: [name, returns]
    properties:
      name:
        type: string
        pattern: "^[a-z][a-z0-9_]*$"
      summary:
        type: string
        description: One sentence, shown in the function picker.
      params:
        type: array
        items: { $ref: "#/$defs/param" }
      returns:
        $ref: "#/$defs/valueType"

  param:
    type: object
    additionalProperties: false
    required: [name, type]
    properties:
      name:
        type: string
        pattern: "^[a-z][a-z0-9_]*$"
      type: { $ref: "#/$defs/valueType" }
      description:
        type: string
        description: >-
          One sentence saying what this parameter is for, shown beside its input in the function
          builder and as signature help while the call is being typed. Optional here so an existing
          Host manifest keeps validating; Hatua's own `schemas/functions/*.yaml` are held to a
          stricter rule by the generator, which refuses to build without one.
      optional:
        type: boolean
        description: Optional parameters must come last.
      variadic:
        type: boolean
        description: >-
          One or more of this type. Only the last parameter may be variadic.

  valueType:
    enum: [text, number, boolean, datetime, list, object, item, unknown, "null"]
    description: >-
      The Component Manifest's output types, plus the two that exist only in the expression
      language: `unknown` for a value whose type cannot be known statically — which is accepted with
      a warning and checked at run time — and `null`, the one absent value, which satisfies any
      declared type.
