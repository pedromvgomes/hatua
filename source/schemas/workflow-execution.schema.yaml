# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://hatua.dev/schemas/workflow-execution.json
title: Workflow Execution
description: >-
  The record of one run of a Workflow Definition, handed to Hatua by the Host and rendered as run
  history. Read-only: Hatua never produces one, because it never executes anything.

  An execution REFERENCES its definition by version rather than embedding it. That is why published
  versions are immutable and retained — painting a three-week-old run against today's definition
  would put durations on steps that did not exist and silently drop steps that did.

  There is no run-level metadata block. Totals and pivots (`tokens per model`, `tokens per step`)
  are derived by Hatua from the per-step values below, using the `measure` / `dimension` roles the
  component manifests declare. That keeps runners from each inventing their own summary shape.

type: object
additionalProperties: false
required: [run_id, status, workflow, started_at, steps]

properties:
  run_id:
    type: string
    minLength: 1

  status:
    enum: [running, succeeded, failed]

  workflow:
    type: object
    additionalProperties: false
    required: [id, version]
    description: Resolved through `WorkflowStore.loadVersion(id, version)`.
    properties:
      id: { type: string, minLength: 1 }
      version: { type: integer, minimum: 1 }

  trigger:
    type: object
    additionalProperties: false
    required: [id]
    description: Which declared trigger fired, and what it delivered.
    properties:
      id:
        type: string
        minLength: 1
        description: Matches a `triggers[].id` in the referenced definition.
      payload:
        type: object
        additionalProperties: true

  started_at: { type: string, format: date-time }
  finished_at: { type: string, format: date-time }
  duration_ms: { type: number, minimum: 0 }

  steps:
    type: array
    items: { $ref: "#/$defs/stepExecution" }

  log:
    type: array
    items: { $ref: "#/$defs/logEntry" }

$defs:
  stepExecution:
    type: object
    additionalProperties: false
    required: [id, status]
    properties:
      id:
        type: string
        minLength: 1
        description: Matches a `Step.id` in the referenced definition version.
      status:
        enum: [pending, running, succeeded, failed, skipped]
      duration_ms: { type: number, minimum: 0 }
      resolved_input:
        description: The step's inputs with every Reference replaced by the value it received.
      output: {}
      metadata:
        type: object
        additionalProperties: true
        description: >-
          Values for the keys this step's component declares under `metadata` in its manifest. The
          manifest supplies the label, type, unit, and whether each key is a measure or a dimension;
          this carries only the values, so the UI renders any component's metadata generically.
      error: { $ref: "#/$defs/error" }
      iterations:
        type: array
        description: >-
          Present only on loop steps. `core.for_each` runs its children once per item, so a flat
          `stepId -> status` list cannot express "this step succeeded 23 times and failed once".
          Each pass gets its own record with its own nested step results.
        items: { $ref: "#/$defs/iteration" }

  iteration:
    type: object
    additionalProperties: false
    required: [index, status]
    properties:
      index: { type: integer, minimum: 0 }
      status:
        enum: [pending, running, succeeded, failed, skipped]
      duration_ms: { type: number, minimum: 0 }
      steps:
        type: array
        items: { $ref: "#/$defs/stepExecution" }
      error: { $ref: "#/$defs/error" }

  error:
    type: object
    additionalProperties: false
    required: [message]
    properties:
      message: { type: string }
      code:
        type: string
        description: Stable machine code, so the UI can react without parsing prose.

  logEntry:
    type: object
    additionalProperties: false
    required: [at, message]
    properties:
      at: { type: string, format: date-time }
      step:
        type: string
        description: Optional — run-level entries have no step.
      channel:
        type: string
        description: Free-form origin label, e.g. `email`, `error`.
      message: { type: string }
