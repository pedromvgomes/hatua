# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://hatua.dev/schemas/workflow-definition.json
title: Workflow Definition
description: >-
  The declarative description of a workflow — its steps, the mapping between one step's typed
  outputs and the next step's inputs, branches and loops. Read AND written by Hatua, unlike a
  Workflow Execution which is only ever read.

  Steps form a TREE, nesting through `branches` (forks) and `steps` (loops); they are never an
  arbitrary graph. There is deliberately no position data anywhere in this document: node placement
  is computed from the tree on every render, which is what makes it impossible for a hand-edited
  file and the flow map to disagree. See ADR-0001.

type: object
additionalProperties: false
required: [id, name, version, status, steps]

properties:
  id:
    type: string
    minLength: 1
    description: Stable identity of the workflow, unchanged across every version.

  name:
    type: string
    description: Human name. Free to change; nothing references it.

  version:
    type: integer
    minimum: 1
    description: >-
      Monotonic, allocated by Hatua at publish. A Workflow Execution references a workflow by this
      number, which is why published versions are immutable and retained. A draft carries
      `base + 1`; discarding it frees that number for reuse, because a number only becomes permanent
      at publish.

  status:
    enum: [published, draft, archived]
    description: >-
      A workflow has at most one `published` version and at most one `draft` at any time. Publishing
      promotes the draft and automatically moves the outgoing published version to `archived`.
      Two concurrent drafts are forbidden because the second publish would always fail, forcing
      either a merge or the loss of someone's work.

  connections:
    type: array
    description: >-
      Connections are established OUTSIDE Hatua — it has no server, so it can neither hold a client
      secret nor receive an OAuth redirect. The Host returns already-established connections and
      Hatua only picks among them.
    items: { $ref: "#/$defs/connection" }

  triggers:
    type: array
    description: >-
      What starts the workflow. Triggers are NOT steps: they live here rather than in `steps`, and
      they replace the older `core.start` step entirely. A workflow may declare several; a step
      addresses one by name as `{{triggers.<id>.<field>}}`, and the built-in `TRIGGER` holds the id
      of whichever one actually fired.

      A trigger's declared outputs ARE the workflow's parameter contract — which is why there is no
      separate `inputs` section.
    items: { $ref: "#/$defs/trigger" }

  vars:
    type: array
    description: >-
      Mutable workflow-scoped state, readable as `{{var.<key>}}` and written by `data.set_var`.
      Distinct from trigger payloads, which arrive from outside. A value may be a literal or an
      expression, so a var can normalise differently-shaped trigger payloads into one shape.
    items: { $ref: "#/$defs/variable" }

  steps:
    type: array
    description: The root sequence. Every step is an instance of a Component declared by a manifest.
    items: { $ref: "#/$defs/step" }

$defs:
  connection:
    type: object
    additionalProperties: false
    required: [id, ref]
    properties:
      id:
        type: string
        minLength: 1
        description: Workflow-local name. Steps reference this, never the ref.
      ref:
        type: [string, "null"]
        description: >-
          Opaque handle minted by the Host, resolved by it to credentials at run time. Nothing
          human-readable is cached alongside it: everything shown to the user comes from
          `ConnectionDescriber.describe(ref)`, so nothing here can go stale when a connection is
          renamed.

          Deliberately named `ref` rather than `token`. A Workflow Definition is a file that lives
          in the Host's repository, usually in git, and a field called `token` invites someone
          committing a real credential into it.

          `null` means the connection was never established. That blocks publish, but not editing —
          you can build a workflow before wiring up its connections.

  trigger:
    type: object
    additionalProperties: false
    required: [id, use]
    properties:
      id:
        type: string
        minLength: 1
        description: Addressed as `{{triggers.<id>.<field>}}`, and matched by the `TRIGGER` built-in.
      use:
        type: string
        minLength: 1
        description: The manifest verb, e.g. `core.schedule` or a Host-supplied `email.received`.
      name:
        type: string
        description: Display name.
      with:
        $ref: "#/$defs/values"

  variable:
    type: object
    additionalProperties: false
    required: [key, value]
    description: >-
      A list of key/value objects rather than a map, so a `type` or `label` can be added later
      without a breaking change to every existing file.
    properties:
      key:
        type: string
        minLength: 1
      value:
        description: A literal, or an expression evaluated by the SDK's shared evaluator.

  step:
    type: object
    additionalProperties: false
    required: [id, use]
    properties:
      id:
        type: string
        minLength: 1
        description: >-
          Stable, and what References point at. This is why renaming a step never breaks a mapping.
      use:
        type: string
        minLength: 1
        description: >-
          The manifest verb, e.g. `email.send`. Hatua treats most of these as opaque, but interprets
          three structurally: `core.fork` creates branches, `core.for_each` nests and exposes
          `item`, and `data.map` derives its outputs from its own `entries` field rather than from
          its manifest. The first two drive reference scope and derived layout; the third drives
          reference scope alone.

          `data.map` is the one component whose outputs a manifest cannot declare, because they are
          whatever the user named. Its `with.entries` is a list of `{key, value, type}`, and a
          downstream step addresses them as `{{<id>.<key>}}` with the declared type — which is what
          lets the type checker treat a mapping step exactly like any other.
      name:
        type: string
      with:
        $ref: "#/$defs/values"
      branches:
        type: array
        minItems: 1
        description: Fork children. Only meaningful on `core.fork`.
        items: { $ref: "#/$defs/branch" }
      steps:
        type: array
        description: Loop children, nested directly with no branch wrapper. Only on `core.for_each`.
        items: { $ref: "#/$defs/step" }

  branch:
    type: object
    additionalProperties: false
    required: [label, steps]
    properties:
      label:
        type: string
      when:
        type: string
        description: >-
          Condition expression. Absent on the fallback branch of a condition fork — order matters
          there, first match wins, and the last branch may be unconditional.
      steps:
        type: array
        items: { $ref: "#/$defs/step" }

  values:
    type: object
    description: >-
      Field values keyed by the manifest's `FieldSpec.k`. Templates remain `{{…}}` strings so the
      document round-trips and a step can be renamed without breaking a mapping.

      A `map` field holds a list of `{key, value, type}` objects rather than a scalar — see
      `data.map` on `use`. That shape is deliberately NOT declared as a `$def` here: which key holds
      a map field is decided by the Component Manifest, not by this schema, so JSON Schema cannot
      reach it. It is checked where the manifest is known, in `@hatua/model` and the Go SDK, and an
      unreferenced definition would be a promise this file does not keep.

      `key` is how downstream steps address the entry — `{{<step id>.<key>}}`. `type` is declared
      rather than inferred from `value`, for the same reason every other field's type is: the
      expression is checked against the declared type, never the reverse.
    additionalProperties: true

