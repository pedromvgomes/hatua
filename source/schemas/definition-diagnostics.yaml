# Diagnostic codes for the Workflow Definition itself — and what each one blocks.
#
# Separate from `diagnostics.yaml`, which is the expression language's. That file
# is generated into the expressions subtree of both languages, and the expressions
# package is deliberately ignorant of manifests, documents and Boards — a code
# about a Fork's branches has no business being emitted there. Its `phase:` also
# means something else: design-time-vs-run-time for one Template, where every code
# here is about the whole document at design time.
#
# What IS shared is the reason both files exist. `blocks:` is part of the
# contract, not a per-language choice: a code that blocks Publish in TypeScript
# and merely informs in Go would let a workflow publish from one builder and not
# another.
#
#   publish  blocks Publish. Never blocks editing — ADR-0009.
#   edit     also blocks editing. Reserved for what ordinary building cannot
#            produce, so a half-filled Step never trips one.
#
# `message` is a template. `{name}` holes are filled from the diagnostic's own
# fields by the same two-line formatter the expression codes use.

codes:
  # ---- a step against its manifest -----------------------------------------

  - code: FIELD_REQUIRED
    blocks: publish
    message: "{label} is required."
    summary: >-
      A required, visible field with nothing in it. Publish-blocking rather than
      edit-blocking because this is what every Step looks like a second after it
      is added.

  - code: COMPONENT_UNKNOWN
    blocks: edit
    message: 'Nothing declares "{use}". It may no longer be available.'
    summary: >-
      A `component.*` or `core.*` verb no manifest declares. Blocks editing
      because building cannot produce it: the catalogue only offers what it
      declares, so this is a hand-edit or a Host that dropped a component.

  # ---- the structural verbs ------------------------------------------------

  - code: FORK_HAS_NO_BRANCHES
    blocks: publish
    message: "This fork has no branches. Add the two paths it chooses between."
    summary: >-
      Separate from FORK_NEEDS_TWO_BRANCHES because the two are different
      mistakes and the fix differs: an empty fork was never configured, while a
      one-branch fork is half-built and the sentence should say which half.

  - code: FORK_NEEDS_TWO_BRANCHES
    blocks: publish
    message: "A fork needs at least two branches — add the other path."
    summary: >-
      One branch is not a fork; it is the same path with a condition on it,
      which is not a thing a runner can do anything useful with.

  - code: BRANCH_UNREACHABLE_AFTER
    blocks: publish
    message: >-
      "{label}" has no condition, so nothing after it can ever run. Only the last
      branch may be unconditional.
    summary: >-
      A condition fork is first-match-wins, so an unconditional branch before the
      end swallows every branch behind it.

  - code: LOOP_HAS_NO_BODY
    blocks: publish
    message: "This loop repeats nothing. Add at least one Step inside it."
    summary: >-
      A `core.for_each` or a `core.repeat` with no children. One code rather than
      two: the mistake is the same and so is the fix, and the message names
      neither verb.

  - code: TRY_HAS_NO_BODY
    blocks: publish
    message: "This try protects nothing. Add at least one Step to its body."
    summary: >-
      A `core.try` whose `steps:` is empty. Its own code rather than
      LOOP_HAS_NO_BODY, for the reason a fork has two: the sentence that helps
      names the region, and "this loop repeats nothing" is the wrong sentence
      about a verb that is not a loop.

  - code: TRY_HAS_NO_HANDLER
    blocks: publish
    message: "This try has no handler, so a failure has nowhere to go. Add a Step to `handler:`."
    summary: >-
      A `core.try` whose `handler:` is absent or empty. Two codes rather than
      one, exactly as a fork's two are: an empty body and an empty handler are
      different halves missing, and the fix differs.

      A try with no handler is not "the same steps without protection" — it is a
      retry policy with nothing to fall back to, and the region that binds the
      failure does not exist, so `{{steps.<id>.error}}` resolves nowhere.

  - code: LOOP_LIST_NOT_A_LIST
    blocks: publish
    message: '"{name}" is {actual}, not a list, so there is nothing to iterate.'
    summary: >-
      A `core.for_each` whose `list` names a value whose declared type is neither
      `list` nor unknown. This is the one rule that makes `t: item` observable:
      `list` is a `ref` field, `FIELD_KIND_TYPES` maps `ref` to `unknown`, so the
      ordinary Slot check accepts anything written there and `item` then resolves
      to nothing while the checker treats it as matching everything.

      Only a statically-KNOWN conflict is reported, matching the type lattice
      everywhere else: `{{ json.parse(x) }}` is `unknown` and is accepted with the
      run-time check that every unknown gets.

      Publish-blocking rather than edit-blocking: retargeting a reference is
      ordinary building, and a loop pointed at the wrong step for ten seconds is
      what building one looks like.

  - code: REPEAT_HAS_NO_CONDITION
    blocks: publish
    message: "This repeat has no condition, so nothing ever ends it. Give it an `until`."
    summary: >-
      A `core.repeat` whose `until` is absent or blank. Structural rather than a
      required field, because the condition is a structural key beside `steps:`
      and not something a manifest declares — the same position a Branch's
      `when` holds, and for the same reason: `FIELD_KIND_TYPES` cannot express
      "a Template that must produce a boolean".

      Publish-blocking rather than edit-blocking, because a repeat a second after
      it is added is exactly this.

  - code: VAR_UNKNOWN
    blocks: publish
    message: 'No variable called "{name}" is declared on this board.'
    summary: >-
      A `core.set_var` naming a var its Board does not declare. The BLOCK_UNKNOWN
      argument one level down: a var key goes stale the moment someone renames or
      removes it, which is ordinary building, so this blocks Publish and never
      editing.

      "on this board" is the load-bearing half of the message. A `core.set_var`
      inside a block writes that block's vars and can never reach the workflow's,
      so naming a workflow var from inside a block is this diagnostic and not a
      scoping accident the runner discovers.

  # ---- blocks ---------------------------------------------------------------

  - code: BLOCK_UNKNOWN
    blocks: publish
    message: 'No block called "{name}" is declared in this workflow.'
    summary: >-
      A `block.*` verb naming nothing under `blocks:`. Publish-blocking and NOT
      edit-blocking, unlike COMPONENT_UNKNOWN: a local name goes stale the moment
      someone renames the block or deletes it, which is ordinary building, and
      the message says the block is missing rather than that the Host withdrew a
      component.

  - code: BLOCK_RECURSION
    blocks: publish
    message: '"{name}" calls itself, directly or through another block.'
    summary: >-
      ADR-0013 refuses recursion, because unbounded recursion is the jump problem
      wearing a contract's clothes. A design-time answer rather than a depth limit
      a runner discovers, so both builders refuse the same document.

  - code: RETURN_OUTSIDE_BLOCK
    blocks: publish
    message: "`core.return` publishes a block's outputs, and this is not inside a block."
    summary: >-
      The root Board declares no outputs, so there is nothing to bind, and
      `core.end` already means "stop the workflow". Publish-blocking rather than
      edit-blocking because moving a Step from a block to the root is ordinary
      building.

  - code: BLOCK_PATH_WITHOUT_RETURN
    blocks: publish
    message: '"{name}" declares outputs, but a path through it can finish without returning.'
    summary: >-
      A path returns via a `core.return` at the Board's root level, or a
      root-level fork that is exhaustive — an unconditional last branch — and
      whose every branch returns. A fork whose every branch carries a `when` is
      not exhaustive: first-match-wins means it can match none of them.

      A `core.repeat` DOES discharge it, and a `core.for_each` never does. That is
      one rule rather than two special cases: a repeat tests its `until` after the
      body, so the body always runs, while a for_each's list may be empty. The
      question is only ever "is this region guaranteed to run at all" — the same
      reasoning that keeps sibling branches out of scope, applied to time instead
      of to paths.

      A `core.try` discharges it only when BOTH its regions do. Its body always
      runs, which alone would read like a repeat — but a failure part-way through
      the body is what a try exists to admit, and that path leaves the body
      unfinished and enters the handler instead. So the guarantee is a
      conjunction: every path out of a try goes through the body or through the
      handler, which is the fork's all-branches reasoning asked of two regions
      where one is conditional.

  - code: STEP_AFTER_RETURN
    blocks: publish
    message: "Nothing after `core.return` can run."
    summary: >-
      The same failure as an unconditional branch that swallows the ones behind
      it, and reported the same way.

  - code: BLOCK_ID_DUPLICATE
    blocks: publish
    message: 'More than one block is called "{name}".'
    summary: >-
      The STEP_ID_DUPLICATE argument one level up: `use: block.x` naming two
      things is the one case nothing can disambiguate. Worth its own code
      because the readers disagree rather than merely tie — a call resolves to
      the first, so the second block is unreachable while still being walked and
      validated.

  - code: DECLARATION_KEY_DUPLICATE
    blocks: publish
    message: 'More than one {side} of "{block}" is called "{name}".'
    summary: >-
      The same argument as STEP_ID_DUPLICATE and BLOCK_ID_DUPLICATE: a name that
      resolves two ways resolves to whichever reader looked first. `params.<k>`
      would offer two completion rows for one value, and a call would report the
      one field missing twice.

  - code: STEP_ID_DUPLICATE
    blocks: publish
    message: 'More than one step on this board is called "{name}".'
    summary: >-
      Ids are scoped to a Board, so two blocks may each hold a step called `ret`.
      Two on ONE board make `{{steps.ret}}` name two things, which is the one
      case a Board cannot disambiguate.
