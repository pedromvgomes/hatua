kind: function
namespace: json
summary: >-
  JSON text. Read a value out of it when something arrives as JSON, or write one
  back to it.
functions:
  - name: parse
    summary: Read a value from JSON text.
    params:
      - name: value
        type: text
        description: The JSON text to read.
    returns: unknown

  - name: stringify
    summary: Write a value as JSON text.
    params:
      - name: value
        type: unknown
        description: The value to write. Lists and objects are written out whole.
    returns: text
