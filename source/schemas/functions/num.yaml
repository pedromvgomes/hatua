kind: function
namespace: num
summary: >-
  Numbers. Dividing always gives a decimal — 7 / 2 is 3.5 — and a half always
  rounds away from zero, so -0.5 rounds to -1.
functions:
  - name: round
    summary: The nearest whole number. A half rounds away from zero.
    params:
      - name: value
        type: number
        description: The number to round.
    returns: number

  - name: floor
    summary: The nearest whole number at or below this one.
    params:
      - name: value
        type: number
        description: The number to round down.
    returns: number

  - name: ceil
    summary: The nearest whole number at or above this one.
    params:
      - name: value
        type: number
        description: The number to round up.
    returns: number

  - name: abs
    summary: The number without its sign.
    params:
      - name: value
        type: number
        description: The number to take the sign off.
    returns: number

  - name: min
    summary: The smallest of the numbers given.
    params:
      - name: values
        type: number
        variadic: true
        description: The numbers to compare, each one its own argument.
    returns: number

  - name: max
    summary: The largest of the numbers given.
    params:
      - name: values
        type: number
        variadic: true
        description: The numbers to compare, each one its own argument.
    returns: number

  - name: parse
    summary: Read a number out of text. Text never becomes a number on its own, so this is how.
    params:
      - name: value
        type: text
        description: The text to read a number from.
    returns: number
