kind: function
namespace: num
summary: >-
  Numbers. There is one numeric type and it is a 64-bit float, so `7 / 2` is
  3.5 in both languages; rounding is half away from zero, so `round(-0.5)` is
  -1 in both.
functions:
  - name: round
    summary: Nearest whole number, halves away from zero.
    params:
      - name: value
        type: number
        description: The number to round.
    returns: number

  - name: floor
    summary: Largest whole number not greater than the value.
    params:
      - name: value
        type: number
        description: The number to round down.
    returns: number

  - name: ceil
    summary: Smallest whole number not less than the value.
    params:
      - name: value
        type: number
        description: The number to round up.
    returns: number

  - name: abs
    summary: Magnitude.
    params:
      - name: value
        type: number
        description: The number whose magnitude is taken.
    returns: number

  - name: min
    summary: Smallest of its arguments.
    params:
      - name: values
        type: number
        variadic: true
        description: The numbers to compare, as separate arguments.
    returns: number

  - name: max
    summary: Largest of its arguments.
    params:
      - name: values
        type: number
        variadic: true
        description: The numbers to compare, as separate arguments.
    returns: number

  - name: parse
    summary: Read a number from text. This is the only text-to-number conversion; none is implicit.
    params:
      - name: value
        type: text
        description: The text to read a number from.
    returns: number
