about: >-
  The slot boundary — where an expression's value meets the type the manifest
  declares for the field. Coercion here is narrow and declared, which is what
  gives "the expression must match the field's type" a precise meaning.

scenarios:
  - name: >-
      a Template that is exactly one hole keeps the expression's own type: the
      number 24, not the string "24"
    template: "{{ steps.s2.count }}"
    type: number
    context: { steps: { s2: { count: 24 } } }
    value: 24

  - name: any scalar may enter a text slot — it is the universal sink
    template: "{{ steps.s2.count }}"
    type: text
    context: { steps: { s2: { count: 24 } } }
    value: "24"

  - name: a boolean may too
    template: "{{ steps.s2.urgent }}"
    type: text
    context: { steps: { s2: { urgent: true } } }
    value: "true"

  - name: and an instant, as RFC 3339 in UTC
    template: "{{ dt.parse('2026-01-02T03:04:05Z') }}"
    type: text
    value: "2026-01-02T03:04:05Z"

  - name: >-
      a list may not. `json.stringify()` says "render this as JSON" explicitly,
      and a list landing in a subject line is far more likely to be a mistake.
    template: "{{ steps.s2.messages }}"
    type: text
    context: { steps: { s2: { messages: [1, 2] } } }
    error: EVAL_TYPE_MISMATCH

  - name: text into number is not implicit — that is what num.parse is for
    template: "{{ steps.s2.label }}"
    type: number
    context: { steps: { s2: { label: "24" } } }
    error: EVAL_TYPE_MISMATCH

  - name: num.parse is how it is done instead
    template: "{{ num.parse(steps.s2.label) }}"
    type: number
    context: { steps: { s2: { label: "24" } } }
    value: 24

  - name: a boolean into a number slot is refused
    template: "{{ steps.s2.urgent }}"
    type: number
    context: { steps: { s2: { urgent: true } } }
    error: EVAL_TYPE_MISMATCH

  - name: >-
      a multi-hole template produces text, so a number slot refuses it. This is
      the legacy `{{steps.s2.count}} > 0` shape, caught at run time when it reaches
      one.
    template: "{{ steps.s2.count }} > 0"
    type: boolean
    context: { steps: { s2: { count: 24 } } }
    error: EVAL_TYPE_MISMATCH

  - name: null satisfies a text slot
    template: "{{ steps.s2.total }}"
    type: text
    context: { steps: { s2: { total: null } } }
    value: null

  - name: null satisfies a number slot
    template: "{{ steps.s2.total }}"
    type: number
    context: { steps: { s2: { total: null } } }
    value: null

  - name: null satisfies a boolean slot
    template: "{{ steps.s2.total }}"
    type: boolean
    context: { steps: { s2: { total: null } } }
    value: null

  - name: >-
      null satisfies a list slot too. Whether absence is *acceptable* is `req:`'s
      business, not the evaluator's.
    template: "{{ steps.s2.total }}"
    type: list
    context: { steps: { s2: { total: null } } }
    value: null

  - name: an unknown slot type accepts anything, and defers the check upstream
    template: "{{ steps.s2.messages }}"
    type: unknown
    context: { steps: { s2: { messages: [1, 2] } } }
    value: [1, 2]

  - name: >-
      `item` accepts anything for the same reason — a loop's element shape is
      not known statically
    template: "{{ steps.s4.item }}"
    type: item
    context: { steps: { s4: { item: { subject: One } } } }
    value: { subject: One }

  - name: an object into an object slot passes through unchanged
    template: "{{ steps.s2.meta }}"
    type: object
    context: { steps: { s2: { meta: { sender: Dane } } } }
    value: { sender: Dane }
