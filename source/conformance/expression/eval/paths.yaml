about: >-
  Path resolution: what is addressable, what happens when it is not there, and
  how projection and indexing behave. `onMissing` governs resolution and nothing
  else — an absent value and a present null are indistinguishable once resolved,
  which is what keeps the operator truth tables single-valued.

scenarios:
  - name: a step output keeps its own type
    template: "{{ steps.s2.count }}"
    type: number
    context: { steps: { s2: { count: 24 } } }
    value: 24

  - name: a trigger payload is addressed through `triggers`
    template: "{{ triggers.nightly.triggered_at }}"
    type: text
    context: { triggers: { nightly: { triggered_at: "07:00" } } }
    value: "07:00"

  - name: a workflow variable is addressed through `var`
    template: "{{ var.digest_to }}"
    type: text
    context: { var: { digest_to: "me@dane.dev" } }
    value: "me@dane.dev"

  - name: a Run Context value is addressed through `run`
    template: "{{ run.tenant }}"
    type: text
    context: { run: { tenant: acme } }
    value: acme

  - name: >-
      `run` is a root of its own, so a step called `run` does not shadow it and
      is not shadowed by it
    template: "{{ run.id }}"
    type: text
    context: { run: { id: r_814 }, steps: { run: { id: s_1 } } }
    value: r_814

  - name: a Run Context key the Host did not supply is an error by default
    template: "{{ run.tenant }}"
    type: text
    context: { run: { id: r_814 } }
    error: EVAL_MISSING_PATH

  - name: TRIGGER names which trigger fired
    template: "{{ TRIGGER }}"
    type: text
    context: { TRIGGER: nightly }
    value: nightly

  - name: >-
      an empty TRIGGER is absent rather than present-and-empty. Go cannot tell
      an unset string from an empty one, and a trigger id is required to be
      non-empty anyway.
    template: "{{ TRIGGER }}"
    type: text
    context: { TRIGGER: "" }
    error: EVAL_MISSING_PATH

  - name: a nested path walks objects
    template: "{{ steps.s2.meta.sender.name }}"
    type: text
    context: { steps: { s2: { meta: { sender: { name: Dane } } } } }
    value: Dane

  - name: a missing step is an error by default
    template: "{{ steps.s9.count }}"
    type: number
    context: { steps: { s2: { count: 24 } } }
    error: EVAL_MISSING_PATH

  - name: a missing key is an error by default
    template: "{{ steps.s2.total }}"
    type: number
    context: { steps: { s2: { count: 24 } } }
    error: EVAL_MISSING_PATH

  - name: "under onMissing: null the same path simply yields null"
    template: "{{ steps.s2.total }}"
    type: number
    on_missing: "null"
    context: { steps: { s2: { count: 24 } } }
    value: null

  - name: a present null is not missing, so it never raises
    template: "{{ steps.s2.total }}"
    type: number
    context: { steps: { s2: { total: null } } }
    value: null

  - name: reading a property of null yields null again
    template: "{{ steps.s2.meta.sender.name }}"
    type: text
    context: { steps: { s2: { meta: null } } }
    value: null

  - name: >-
      reading a member of a reserved word reads a member of that value, and
      `null.x` is null like every other property of the absent value
    template: "{{ null.x }}"
    type: text
    value: null

  - name: projection reads a field of every element
    template: "{{ steps.s2.messages[].subject }}"
    type: list
    context:
      steps:
        s2:
          messages:
            - { subject: One }
            - { subject: Two }
    value: [One, Two]

  - name: projection over a missing field in one element yields null there
    template: "{{ steps.s2.messages[].subject }}"
    type: list
    on_missing: "null"
    context:
      steps:
        s2:
          messages:
            - { subject: One }
            - { body: Two }
    value: [One, null]

  - name: numeric indexing selects one element
    template: "{{ steps.s2.messages[0].subject }}"
    type: text
    context: { steps: { s2: { messages: [{ subject: One }, { subject: Two }] } } }
    value: One

  - name: a negative index counts from the end
    template: "{{ steps.s2.messages[-1].subject }}"
    type: text
    context: { steps: { s2: { messages: [{ subject: One }, { subject: Two }] } } }
    value: Two

  - name: an index past the end is missing
    template: "{{ steps.s2.messages[9] }}"
    type: object
    context: { steps: { s2: { messages: [] } } }
    error: EVAL_MISSING_PATH

  - name: text indexing reads a key, which is how opaque payloads are walked
    template: "{{ steps.s2.body['order id'] }}"
    type: text
    context: { steps: { s2: { body: { "order id": abc } } } }
    value: abc

  - name: indexing a non-list with a number is a type error, not a miss
    template: "{{ steps.s2.count[0] }}"
    type: number
    context: { steps: { s2: { count: 24 } } }
    error: EVAL_OPERAND_TYPE

  - name: projecting something that is not a list is a type error
    template: "{{ steps.s2.count[] }}"
    type: list
    context: { steps: { s2: { count: 24 } } }
    error: EVAL_OPERAND_TYPE

  - name: >-
      `__proto__` does not resolve on an object that does not own it. A Workflow
      Definition is user-editable YAML, so this is reachable input rather than a
      hypothetical — and reading own properties only is the whole guarantee.
    template: "{{ steps.s2.__proto__ }}"
    type: object
    context: { steps: { s2: { count: 24 } } }
    error: EVAL_MISSING_PATH

  - name: neither does `constructor`
    template: "{{ steps.s2.constructor }}"
    type: object
    context: { steps: { s2: { count: 24 } } }
    error: EVAL_MISSING_PATH

  - name: nor `prototype`
    template: "{{ steps.s2.prototype }}"
    type: object
    context: { steps: { s2: { count: 24 } } }
    error: EVAL_MISSING_PATH

  - name: >-
      but a payload that genuinely *holds* one of those keys reads back — it is
      ordinary data, and a deny list here would have made the two runtimes
      disagree about it, since Go has no prototype chain to defend
    template: "{{ steps.s2.constructor }}"
    type: text
    context: { steps: { s2: { constructor: Acme Corp } } }
    value: Acme Corp

  - name: including `__proto__`, which JSON.parse creates as a real own property
    template: "{{ steps.s2.__proto__ }}"
    type: text
    context: { steps: { s2: { __proto__: inherited } } }
    value: inherited

  - name: and one reached through json.parse, which is how it usually arrives
    template: "{{ json.parse(steps.s2.body).constructor }}"
    type: text
    context: { steps: { s2: { body: '{"constructor":"Acme"}' } } }
    value: Acme

  - name: >-
      the index is evaluated only once the object resolves, so a missing path
      short-circuits before it. Evaluating it first — as Go once did — made this
      a division error in one runtime and a missing path in the other.
    template: "{{ steps.s1.absent[1 / 0] }}"
    type: number
    context: { steps: { s1: {} } }
    error: EVAL_MISSING_PATH

  - name: and an empty projection short-circuits it too
    template: "{{ list.len(steps.s1.xs[][1 / 0]) }}"
    type: number
    context: { steps: { s1: { xs: [] } } }
    value: 0

  - name: >-
      a fractional index is neither a position nor a key — JavaScript would hand
      back undefined and Go would truncate, so it is refused instead
    template: "{{ steps.s2.ids[3 / 2] }}"
    type: number
    context: { steps: { s2: { ids: [1, 2, 3] } } }
    error: EVAL_OPERAND_TYPE

  - name: written as a literal it is refused just the same
    template: "{{ steps.s2.ids[1.5] }}"
    type: number
    context: { steps: { s2: { ids: [1, 2, 3] } } }
    error: EVAL_OPERAND_TYPE
