about: >-
  What a step may address. Scope arrives as an argument rather than being
  derived inside the expressions package, which is what keeps it depending on
  `@hatua/schema` alone — and it is why these scenarios can state a scope
  directly instead of building a whole Workflow Definition to imply one.

scenarios:
  - name: a step in scope resolves
    template: "{{ steps.s2.count }}"
    type: number
    scope: &wide
      - path: steps.s2
        type:
          type: object
          members:
            count: { type: number }
      - path: triggers.nightly
        type:
          type: object
          members:
            triggered_at: { type: datetime }
      - path: var.digest_to
        type: { type: text }
      - path: run.tenant
        type: { type: text }
      - path: TRIGGER
        type: { type: text }
    expect: []

  - name: a step that is not in scope is refused
    template: "{{ steps.s9.count }}"
    type: number
    scope: *wide
    expect:
      - { code: EXPR_UNKNOWN_REFERENCE, severity: error }

  - name: >-
      a dotted scope path is one entry, not two — `triggers` alone is a prefix
      rather than a value, which is what lets several triggers coexist
    template: "{{ triggers.nightly.triggered_at }}"
    type: datetime
    scope: *wide
    expect: []

  # ---- a block's board ------------------------------------------------------
  #
  # A block reads only what it declares, plus the Run Context. Scope arrives as
  # an argument, so these state a block's board directly rather than building a
  # whole Workflow Definition to imply one — but the scope below is exactly what
  # ScopeFor emits for a step inside a block, in both languages.

  - name: a block's parameter resolves, and nests through its declared shape
    template: "{{ params.entry.headline }}"
    type: text
    scope: &board
      - path: params.entry
        type:
          type: object
          members:
            headline: { type: text }
      - path: var.attempt_note
        type: { type: text }
      - path: run.tenant
        type: { type: text }
      - path: steps.put
        type:
          type: object
          members:
            location: { type: text }
    expect: []

  - name: so does a step on the same board
    template: "{{ steps.put.location }}"
    type: text
    scope: *board
    expect: []

  - name: >-
      a step OUTSIDE the block is refused — this is the contract, and if it ever
      resolves then scope has stopped being an exact walk
    template: "{{ steps.s2.count }}"
    type: number
    scope: *board
    expect:
      - { code: EXPR_UNKNOWN_REFERENCE, severity: error }

  - name: the workflow's variables are the call site's, not the block's
    template: "{{ var.digest_to }}"
    type: text
    scope: *board
    expect:
      - { code: EXPR_UNKNOWN_REFERENCE, severity: error }

  - name: >-
      and neither are its Triggers — a block that needs to know what started the
      run takes it as a parameter
    template: "{{ triggers.nightly.triggered_at }}"
    type: datetime
    scope: *board
    expect:
      - { code: EXPR_UNKNOWN_REFERENCE, severity: error }

  - name: >-
      Run Context crosses, because nothing in the document declares it: the Host
      supplies it to every execution, so it is exact on every path of every board
    template: "{{ run.tenant }}"
    type: text
    scope: *board
    expect: []

  - name: an undeclared parameter is refused like any other unknown root member
    template: "{{ params.missing }}"
    type: text
    scope: *board
    expect:
      - { code: EXPR_UNKNOWN_REFERENCE, severity: error }

  - name: an unknown trigger is refused
    template: "{{ triggers.hourly.triggered_at }}"
    type: datetime
    scope: *wide
    expect:
      - { code: EXPR_UNKNOWN_REFERENCE, severity: error }

  - name: a workflow variable
    template: "{{ var.digest_to }}"
    type: text
    scope: *wide
    expect: []

  - name: an unknown variable is refused
    template: "{{ var.nothing }}"
    type: text
    scope: *wide
    expect:
      - { code: EXPR_UNKNOWN_REFERENCE, severity: error }

  - name: >-
      a Run Context key. It is an ordinary dotted scope entry — `run` alone is a
      prefix, exactly as `triggers` and `var` are — so nothing in the checker
      knows the difference
    template: "{{ run.tenant }}"
    type: text
    scope: *wide
    expect: []

  - name: a Run Context key the Host never declared is refused
    template: "{{ run.caller_ip }}"
    type: text
    scope: *wide
    expect:
      - { code: EXPR_UNKNOWN_REFERENCE, severity: error }

  - name: the TRIGGER built-in
    template: "{{ TRIGGER == 'nightly' }}"
    type: boolean
    scope: *wide
    expect: []

  - name: an undeclared member of a step is a warning, not an error
    template: "{{ steps.s2.total }}"
    type: number
    scope: *wide
    expect:
      - { code: EXPR_TYPE_UNKNOWN, severity: warning }

  - name: >-
      a name that is neither in scope nor a function namespace is refused
      wherever it appears, including inside an argument
    template: "{{ num.abs(nothing) }}"
    type: number
    scope: *wide
    expect:
      - { code: EXPR_UNKNOWN_REFERENCE, severity: error }

  - name: >-
      a name that collides with a JavaScript prototype member is treated like
      any other undeclared member. Reading `members.constructor` without an
      own-property check made TypeScript conclude the expression "produces
      undefined" and block publish, while Go warned and allowed it.
    template: "{{ steps.s2.constructor }}"
    type: text
    scope: *wide
    expect:
      - { code: EXPR_TYPE_UNKNOWN, severity: warning }

  - name: and so are the other two
    template: "{{ steps.s2.__proto__ }}{{ steps.s2.prototype }}"
    type: text
    scope: *wide
    expect: []

  - name: several problems are all reported, not just the first
    template: "{{ steps.s9.a }} and {{ steps.s8.b }}"
    type: text
    scope: *wide
    expect:
      - { code: EXPR_UNKNOWN_REFERENCE, severity: error }
      - { code: EXPR_UNKNOWN_REFERENCE, severity: error }
