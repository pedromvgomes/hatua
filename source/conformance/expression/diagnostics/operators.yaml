about: >-
  Operators, at design time. Only a *known* conflict is an error: operators
  never coerce, so a known wrong type can only ever fail at run time too, while
  an unknown one defers rather than blocking a publish over something that may
  well be right.

scenarios:
  - name: arithmetic on numbers
    template: "{{ s2.count + 1 }}"
    type: number
    scope: &inbox
      - path: s2
        type:
          type: object
          members:
            count: { type: number }
            subject: { type: text }
            urgent: { type: boolean }
            at: { type: datetime }
            output: { type: text }
    expect: []

  - name: arithmetic on text is a known conflict
    template: "{{ s2.subject + 1 }}"
    type: number
    scope: *inbox
    expect:
      - { code: EXPR_OPERAND_TYPE, severity: error }

  - name: >-
      arithmetic on an unknown type defers to run time, where the value itself
      decides
    template: "{{ json.parse(s2.output).count + 1 }}"
    type: number
    scope: *inbox
    expect: []

  - name: a boolean context needs a boolean
    template: "{{ s2.urgent && true }}"
    type: boolean
    scope: *inbox
    expect: []

  - name: and a number in one is a known conflict
    template: "{{ s2.count && true }}"
    type: boolean
    scope: *inbox
    expect:
      - { code: EXPR_OPERAND_TYPE, severity: error }

  - name: so is a number under `!`
    template: "{{ !s2.count }}"
    type: boolean
    scope: *inbox
    expect:
      - { code: EXPR_OPERAND_TYPE, severity: error }

  - name: comparison across two known types is a known conflict
    template: "{{ s2.count > s2.subject }}"
    type: boolean
    scope: *inbox
    expect:
      - { code: EXPR_OPERAND_TYPE, severity: error }

  - name: comparing two instants is fine
    template: "{{ s2.at > s2.at }}"
    type: boolean
    scope: *inbox
    expect: []

  - name: booleans have no order
    template: "{{ s2.urgent > s2.urgent }}"
    type: boolean
    scope: *inbox
    expect:
      - { code: EXPR_OPERAND_TYPE, severity: error }
      - { code: EXPR_OPERAND_TYPE, severity: error }

  - name: >-
      equality is total, so it accepts any two types without complaint — and
      answers false
    template: "{{ s2.count == s2.subject }}"
    type: boolean
    scope: *inbox
    expect: []

  - name: a conditional's arms agreeing gives that type
    template: "{{ s2.urgent ? s2.count : 0 }}"
    type: number
    scope: *inbox
    expect: []

  - name: >-
      arms that disagree give an unknown type, which is honest rather than
      picking one of them
    template: "{{ s2.urgent ? s2.count : s2.subject }}"
    type: number
    scope: *inbox
    expect:
      - { code: EXPR_TYPE_UNKNOWN, severity: warning }

  - name: a non-boolean condition is a known conflict
    template: "{{ s2.count ? 1 : 2 }}"
    type: number
    scope: *inbox
    expect:
      - { code: EXPR_OPERAND_TYPE, severity: error }

  - name: "`??` takes the arms' type when they agree"
    template: "{{ s2.count ?? 0 }}"
    type: number
    scope: *inbox
    expect: []

  - name: and is unknown when they do not
    template: "{{ s2.count ?? s2.subject }}"
    type: number
    scope: *inbox
    expect:
      - { code: EXPR_TYPE_UNKNOWN, severity: warning }

  - name: a null literal satisfies any declared type
    template: "{{ null }}"
    type: number
    scope: *inbox
    expect: []
