# A Host serving many manifests at one URL. Both this and a bare single manifest
# must parse, since one file per component suits authoring and a catalogue suits
# serving.
#
# `icon` is a URL the Host serves, not a name from an icon set — Hatua ships no
# set for a name to mean anything against. Root-relative here, because that is
# what a Host serving its own assets writes; absolute URLs and `data:` URIs are
# equally valid.
components:
  - kind: component
    use: component.email.send
    name: Send email
    group: Email
    icon: /icons/mail.svg
    blurb: Send a message through a connected mailbox.
    fields:
      - k: connection
        label: Mailbox
        kind: conn
        conn_type: email
        req: true
      - k: to
        label: To
        kind: text
        req: true
        hint: Who receives it.
    outputs:
      - k: message_id
        label: Message ID
        t: text
  - kind: trigger
    use: component.email.received
    name: When mail arrives
    group: Email
    icon: /icons/inbox.svg
    blurb: Starts the workflow when a message arrives.
    fields:
      - k: connection
        label: Mailbox
        kind: conn
        conn_type: email
        req: true
    outputs:
      - k: message
        label: Message
        t: object
        of:
          - k: subject
            label: Subject
            t: text
          # The set's one list, and what `t: item` is resolved THROUGH: a
          # `core.for_each` pointed here binds an element carrying these members,
          # read as `{{steps.<loop id>.item.filename}}`.
          - k: attachments
            label: Attachments
            t: list
            of:
              - { k: filename, label: Filename, t: text }
              - { k: bytes, label: Size, t: number }
  - kind: component
    use: component.agent.act
    name: Run agent
    group: Intelligence
    icon: /icons/zap.svg
    blurb: Ask a model to act on the workflow's data.
    fields:
      - k: connection
        label: Model
        kind: conn
        conn_type: llm
        req: true
    outputs:
      - k: result
        label: Result
        t: text
    metadata:
      - k: tokens
        label: Tokens used
        t: number
        role: measure
        unit: tokens
      - k: model
        label: Model
        t: text
        role: dimension
  - kind: component
    use: core.fork
    name: Branch
    group: Built-in
    icon: /icons/branch.svg
    blurb: Take one path or several, on a condition.
    fields: []
    outputs: []
  - kind: component
    use: core.return
    name: Return
    group: Built-in
    icon: /icons/return.svg
    blurb: Publish a block's declared outputs and end it.
    # Its fields are the enclosing block's `outputs:`, which no manifest can
    # declare — the mirror of core.map, whose outputs no manifest can declare
    # either. The entry exists so a return is a component like any other; the
    # contract it is held to comes from the Board it sits on.
    fields: []
    outputs: []
  - kind: component
    use: core.for_each
    name: For each
    group: Built-in
    icon: /icons/repeat.svg
    blurb: Repeat the steps inside it once per item.
    fields:
      # `list`, and the name is load-bearing: `item` means "one element of
      # whatever THIS key points at", so a reader looking under a different key
      # resolves it to nothing and reports no type at all.
      - k: list
        label: List
        kind: ref
        req: true
        hint: The list to walk.
    outputs:
      # `t: item` rather than `object`. The shape is not in this file — it is one
      # element of whatever `list` points at, read off the source output's `of:`.
      # Declaring `object` would be a shape nothing verified, and every
      # `{{steps.<id>.item.<field>}}` would type-check against members the
      # manifest never had.
      - k: item
        label: Item
        t: item
  - kind: component
    use: core.try
    name: Attempt
    group: Built-in
    icon: /icons/shield.svg
    # Everything a manifest names reaches an end user's screen, so neither the
    # name nor the blurb spends a word only somebody who has written code knows:
    # not "try", and not "handler".
    blurb: Run these steps, and do something else if they fail.
    # Wrapping one step is retry; wrapping a region is fallback, so one verb
    # serves both. Its two regions are `steps:` and `handler:`, which are
    # positions in the document rather than fields — so they are not here.
    fields:
      # The retry policy IS a set of ordinary fields, deliberately. A condition
      # had to leave `with:` because `FIELD_KIND_TYPES` has no mappable boolean;
      # a count and a delay are numbers, and `number` is mappable — so the
      # argument that moved `until` does not reach these, and a structural key
      # here would be a conclusion copied without its reason.
      - k: attempts
        label: Attempts
        kind: number
        hint: How many times to run the body before the handler takes over.
      - k: backoff_ms
        label: Backoff
        kind: number
        hint: Milliseconds to wait between attempts.
    outputs:
      # The failure, and the whole of what a try binds. Read as
      # `{{steps.<try id>.error}}` by the handler's children and by nothing else —
      # an ordinary output of the container step, which is how core.for_each
      # already exposes `item`, and why neither costs a namespace root.
      #
      # Declared here rather than invented by a runner, because Hatua ships this
      # verb (ADR-0014) and this shape is the contract every Host runner fills in.
      # `type` is what a core.fork inside the handler branches on, which is why
      # error-type matching needs no matcher of its own.
      - k: error
        label: Error
        t: object
        of:
          - { k: message, label: Message, t: text }
          - { k: type, label: Type, t: text }
          - { k: step, label: Failed step, t: text }
