# Every section exercised: multiple triggers, a null connection ref, an
# expression var, a condition fork with a fallback branch, a mapping step, a
# nested loop, and a `core.try` with both of its regions.
#
# The `when:` below reads `{{ steps.s2.count > 0 }}`, not `{{steps.s2.count}} > 0`. That is a
# contract edit rather than a typo fix: the second is a *text* template, and a
# branch condition is declared boolean, so the builder refuses to publish it. It
# would otherwise reach a runner as the string "24 > 0" and be mistaken for
# truthy.
id: wf_morning_inbox_triage
name: Morning inbox triage
version: 8
status: draft

connections:
  - id: mailbox
    ref: conn_9f21c
  - id: brain
    ref: conn_44b0e
  - id: notifier
    ref: ~

triggers:
  - id: nightly
    use: core.schedule
    name: Weekday mornings
    with:
      cron: "0 7 * * 1-5"
      catchup: false
  - id: on_mail
    use: component.email.received
    name: When mail arrives
    with:
      connection: mailbox

vars:
  - key: triage_date
    t: datetime
    value: "{{ TRIGGER == 'nightly' ? triggers.nightly.triggered_at : triggers.on_mail.received_at }}"
  - key: digest_to
    t: text
    value: me@dane.dev

steps:
  - id: s2
    use: component.email.fetch
    name: Fetch emails
    with:
      connection: mailbox
      filter: "is:unread newer_than:1d"
      max: 50
  - id: s3
    use: core.fork
    name: Fork on new mail
    with:
      mode: condition
    branches:
      - label: Has new mail
        when: "{{ steps.s2.count > 0 }}"
        steps:
          - id: s4
            use: core.for_each
            name: For each message
            with:
              list: "{{steps.s2.messages}}"
              concurrency: 1
            steps:
              - id: s5
                use: component.agent.act
                name: Triage message
                with:
                  connection: brain
                  instruction: "Classify {{steps.s4.item.subject}}."
          - id: s6
            use: component.email.send
            name: Send digest
            with:
              connection: mailbox
      - label: Otherwise
        steps: []
  - id: s8
    use: core.map
    name: Shape the digest
    with:
      # core.map is the third verb interpreted structurally: its outputs are
      # whatever these entries name, which no manifest can declare in advance.
      # A downstream step addresses them as `{{steps.s8.headline}}` with the type
      # declared here.
      entries:
        - key: headline
          value: "Inbox digest · {{ steps.s2.count }} messages"
          type: text
        - key: unread
          value: "{{ steps.s2.count }}"
          type: number
        - key: busy
          value: "{{ steps.s2.count > 20 }}"
          type: boolean
  - id: s10
    use: core.try
    name: Publish the digest
    # The retry policy is ordinary `with:` fields. A count and a delay are
    # numbers, and `number` is a mappable field kind — so the argument that
    # forced `until` out of `with:` does not reach here, and a manifest field
    # gives the form control, the type and the validation for nothing.
    with:
      attempts: 3
      backoff_ms: 500
    steps:
      - id: s11
        use: component.email.send
        name: Send the digest
        with:
          connection: mailbox
          to: "{{ var.digest_to }}"
          subject: "{{ steps.s8.headline }}"
    # The failure is bound as the try's own output and reaches these children
    # alone — `{{steps.s10.error}}`. The body cannot read it, because the body is
    # what produces it, and neither can s9 below, because whether there was a
    # failure at all is decided during a run.
    handler:
      - id: s12
        use: component.email.send
        name: Tell someone
        with:
          connection: notifier
          to: ops@dane.dev
          subject: "Digest failed at {{ steps.s10.error.step }}: {{ steps.s10.error.message }}"
  - id: s9
    use: core.end
    name: End workflow
    with:
      status: ok
